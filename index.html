<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>SOS Quake</title>
	<meta name="description" content="Browser Quake (mrdoob/three-quake) with one-tap P2P — Deathmatch or Team coop.">
	<meta name="theme-color" content="#000000">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="SOS Quake">
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="icon" type="image/svg+xml" href="icon.svg">
	<link rel="apple-touch-icon" href="icon.png">
	<!-- Capture PWA install early (same as Kart/Chess). The game loads pak0 for
	     seconds — if we only listen after that, beforeinstallprompt is already gone. -->
	<script>
	(function () {
		var BUILD = '12';
		window.__sosQuakeDeferredInstall = null;
		window.addEventListener('beforeinstallprompt', function (e) {
			e.preventDefault();
			window.__sosQuakeDeferredInstall = e;
		});
		window.addEventListener('appinstalled', function () {
			window.__sosQuakeDeferredInstall = null;
		});
		// Bust stale PWA / HTTP caches when a new build ships.
		try {
			if (localStorage.getItem('sos.quake.build') !== BUILD) {
				localStorage.setItem('sos.quake.build', BUILD);
				var bust = Promise.resolve();
				if (window.caches && caches.keys) {
					bust = caches.keys().then(function (keys) {
						return Promise.all(keys.map(function (k) { return caches.delete(k); }));
					});
				}
				bust.then(function () {
					if (!('serviceWorker' in navigator)) return;
					return navigator.serviceWorker.getRegistrations().then(function (regs) {
						return Promise.all(regs.map(function (r) { return r.unregister(); }));
					});
				}).then(function () {
					location.reload();
				}).catch(function () {});
				return;
			}
		} catch (e) { /* ignore */ }
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', function () {
				navigator.serviceWorker.register('./sw.js?v=' + BUILD).catch(function () {});
			});
		}
	})();
	</script>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000;
		}
		canvas {
			display: block;
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			width: 100%;
			height: 100%;
		}
		#loading {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 100;
			background: #000;
		}
		#loading-bar {
			width: 200px;
			height: 2px;
			background: #333;
		}
		#loading-progress {
			width: 0%;
			height: 100%;
			background: #fff;
		}
	</style>
</head>
<body>
	<div id="loading">
		<div id="loading-bar"><div id="loading-progress"></div></div>
	</div>
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/",
			"nostr-tools/pure": "https://esm.sh/nostr-tools@2.10.4/pure",
			"nostr-tools/pool": "https://esm.sh/nostr-tools@2.10.4/pool",
			"nostr-tools/nip44": "https://esm.sh/nostr-tools@2.10.4/nip44"
		}
	}
	</script>
	<script type="module" src="main.js?v=12"></script>
</body>
</html>
